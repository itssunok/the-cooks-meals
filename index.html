<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meal Planner</title>
<link rel="stylesheet" href="./styles/tokens.css">
<link rel="stylesheet" href="./styles/components.css">
<script src="./data/meals.js" defer></script>
<script src="./data/weeklyPlan.js" defer></script>
<script src="./data/catFoodSchedule.js" defer></script>
<script src="./data/pantry.js" defer></script>
<script src="./scripts/dateUtils.js" defer></script>
<script src="./scripts/planStore.js" defer></script>
<script src="./scripts/mealStore.js" defer></script>
<script src="./scripts/mealTags.js" defer></script>
<script src="./scripts/pantryStore.js" defer></script>
<script src="./scripts/notifications.js" defer></script>
<script src="./scripts/app.js" defer></script>
</head>
<body>
<div class="page">

  <header class="app-header">
    <span class="app-title">Meal Planner</span>
    <div class="app-header-right">
      <nav class="app-nav">
        <a href="./index.html" class="app-nav-link app-nav-link-active">Today</a>
        <a href="./pages/weekly.html" class="app-nav-link">This Week</a>
        <a href="./pages/rotation.html" class="app-nav-link">Rotation</a>
        <a href="./pages/pantry.html" class="app-nav-link">Pantry</a>
        <a href="./pages/grocery.html" class="app-nav-link">Grocery List</a>
        <a href="./pages/spend.html" class="app-nav-link">Spend Log</a>
      </nav>
      <div class="notif-bell-wrap">
        <button type="button" class="btn-icon-round notif-bell-btn" id="notif-bell-btn" aria-label="Notifications">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
          <span class="notif-bell-badge" id="notif-bell-badge" hidden></span>
        </button>
        <div class="notif-overlay" id="notif-overlay" hidden></div>
        <div class="notif-panel" id="notif-panel" hidden>
          <div class="notif-panel-header">
            <h2 class="title-h3 notif-panel-title">Notifications</h2>
            <button type="button" class="btn-icon-round notif-close-btn" id="notif-close-btn" aria-label="Close notifications">×</button>
          </div>
          <div id="notif-list"></div>
        </div>
      </div>
    </div>
  </header>

  <section class="section" aria-labelledby="today-heading">
    <p class="label-eyebrow text-sm" id="today-date"></p>
    <h1 id="today-heading" class="title-h1">Tonight's Dinner</h1>
    <div id="today-meal-card"></div>
  </section>

  <section class="section" id="cat-food-section" aria-labelledby="cat-food-heading" hidden>
    <h2 id="cat-food-heading" class="section-title">Today's Prep</h2>
    <div id="cat-food-card"></div>
  </section>

</div>
</body>
</html>
