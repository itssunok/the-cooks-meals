<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grocery List — Meal Planner</title>
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/components.css">
<script src="../data/meals.js" defer></script>
<script src="../data/weeklyPlan.js" defer></script>
<script src="../data/pantry.js" defer></script>
<script src="../scripts/planStore.js" defer></script>
<script src="../scripts/mealStore.js" defer></script>
<script src="../scripts/pantryStore.js" defer></script>
<script src="../scripts/groceryStore.js" defer></script>
<script src="../scripts/grocery.js" defer></script>
</head>
<body>
<div class="page">

  <header class="app-header">
    <span class="app-title">Meal Planner</span>
    <nav class="app-nav">
      <a href="../index.html" class="app-nav-link">Today</a>
      <a href="./weekly.html" class="app-nav-link">This Week</a>
      <a href="./rotation.html" class="app-nav-link">Rotation</a>
      <a href="./pantry.html" class="app-nav-link">Pantry</a>
      <a href="./grocery.html" class="app-nav-link app-nav-link-active">Grocery List</a>
      <a href="./spend.html" class="app-nav-link">Spend Log</a>
    </nav>
  </header>

  <section class="section" aria-labelledby="grocery-heading">
    <h1 id="grocery-heading" class="title-h1">Grocery List</h1>
    <p class="section-desc">What's missing for this week's plan, checked against the pantry. Check items off as you shop, or add your own.</p>
    <form id="add-item-form" class="inline-form">
      <input class="form-input inline-form-input" type="text" name="name" placeholder="Add an item" required>
      <button type="submit" class="btn btn-secondary">Add</button>
    </form>
    <div id="grocery-list"></div>
  </section>

</div>
</body>
</html>
