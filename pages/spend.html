<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spend Log — Meal Planner</title>
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/components.css">
<script src="../data/meals.js" defer></script>
<script src="../data/weeklyPlan.js" defer></script>
<script src="../data/catFoodSchedule.js" defer></script>
<script src="../data/pantry.js" defer></script>
<script src="../data/spendLog.js" defer></script>
<script src="../scripts/dateUtils.js" defer></script>
<script src="../scripts/planStore.js" defer></script>
<script src="../scripts/mealStore.js" defer></script>
<script src="../scripts/pantryStore.js" defer></script>
<script src="../scripts/notifications.js" defer></script>
<script src="../scripts/spendStore.js" defer></script>
<script src="../scripts/spend.js" defer></script>
</head>
<body>
<div class="page">

  <header class="app-header">
    <span class="app-title">Meal Planner</span>
    <div class="app-header-right">
      <nav class="app-nav">
        <a href="../index.html" class="app-nav-link">Today</a>
        <a href="./weekly.html" class="app-nav-link">This Week</a>
        <a href="./rotation.html" class="app-nav-link">Rotation</a>
        <a href="./pantry.html" class="app-nav-link">Pantry</a>
        <a href="./grocery.html" class="app-nav-link">Grocery List</a>
        <a href="./spend.html" class="app-nav-link app-nav-link-active">Spend Log</a>
      </nav>
      <div class="notif-bell-wrap">
        <button type="button" class="btn-icon-round notif-bell-btn" id="notif-bell-btn" aria-label="Notifications">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
          <span class="notif-bell-badge" id="notif-bell-badge" hidden></span>
        </button>
        <div class="sheet-overlay" id="notif-overlay" hidden></div>
        <div class="sheet-panel" id="notif-panel" hidden>
          <div class="sheet-panel-header">
            <h2 class="title-h3 sheet-panel-title">Notifications</h2>
            <button type="button" class="btn-icon-round notif-close-btn" id="notif-close-btn" aria-label="Close notifications">×</button>
          </div>
          <div id="notif-list"></div>
        </div>
      </div>
    </div>
  </header>

  <section class="section" aria-labelledby="spend-heading">
    <h1 id="spend-heading" class="title-h1">Spend Log</h1>
    <p class="section-desc">What grocery trips and ordered-out nights actually cost, over time.</p>

    <div class="spend-summary-row">
      <div class="card spend-summary-card">
        <span class="label-eyebrow text-2xs">Groceries this month</span>
        <span id="summary-grocery" class="spend-summary-value"></span>
      </div>
      <div class="card spend-summary-card">
        <span class="label-eyebrow text-2xs">Ordered out this month</span>
        <span id="summary-ordered-out" class="spend-summary-value spend-summary-value-warning"></span>
      </div>
    </div>

    <form id="add-spend-form" class="inline-form">
      <select class="form-input" name="type">
        <option value="grocery">Grocery trip</option>
        <option value="orderedOut">Ordered out</option>
      </select>
      <input class="form-input" type="number" name="amount" step="0.01" min="0.01" placeholder="Amount" required>
      <input class="form-input" type="date" name="date">
      <button type="submit" class="btn btn-secondary">Log</button>
    </form>

    <div id="spend-list"></div>
  </section>

</div>
</body>
</html>
